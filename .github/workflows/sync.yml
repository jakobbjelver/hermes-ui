name: Sync upstream & build Docker image

on:
  push:
    branches: [main]
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hermes-ui

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout upstream monorepo
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: upstream-monorepo
          fetch-depth: 1

      - name: Run transformation
        run: |
          chmod +x scripts/transform.sh
          ./scripts/transform.sh upstream-monorepo

      - name: Check for upstream changes
        id: changes
        run: |
          if git diff --exit-code -- app/ shared/ UPSTREAM.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes from upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected from upstream."
          fi

      - name: Commit and push extracted source
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          UPSTREAM_SHA=$(head -10 UPSTREAM.md | grep -oE '[a-f0-9]{40}' | head -1)
          git add app/ shared/ UPSTREAM.md
          git commit -m "sync: upstream hermes-agent @ ${UPSTREAM_SHA:0:7}

          Auto-synced from NousResearch/hermes-agent main branch."
          git push origin main

      # Build on every push to main (always), or on schedule/trigger only if upstream changed
      - name: Determine if build is needed
        id: build_decision
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Push event — always build."
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes — build."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No changes and not a push — skip build."
          fi

      - name: Set up Docker Buildx
        if: steps.build_decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        if: steps.build_decision.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        if: steps.build_decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        if: steps.build_decision.outputs.build == 'true'
        run: |
          gh api -X PATCH /user/packages/container/hermes-ui/visibility -f visibility=public --silent || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
