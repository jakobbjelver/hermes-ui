name: Sync upstream & build Docker image

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hermes-ui

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout upstream monorepo
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: /tmp/hermes-agent
          # Shallow clone — we only need the latest source, not history
          fetch-depth: 1

      - name: Run transformation
        run: |
          chmod +x scripts/transform.sh
          ./scripts/transform.sh /tmp/hermes-agent

      - name: Check for changes
        id: changes
        run: |
          if git diff --exit-code -- app/ shared/ UPSTREAM.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes from upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will commit and build."
          fi

      - name: Commit and push extracted source
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Read upstream SHA from freshly generated UPSTREAM.md
          UPSTREAM_SHA=$(head -10 UPSTREAM.md | grep -oE '[a-f0-9]{40}' | head -1)
          git add app/ shared/ UPSTREAM.md
          git commit -m "sync: upstream hermes-agent @ ${UPSTREAM_SHA:0:7}

          Auto-synced from NousResearch/hermes-agent main branch."

          git push origin main

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        if: steps.changes.outputs.changed == 'true'
        run: |
          gh api -X PATCH /user/packages/container/hermes-ui/visibility -f visibility=public --silent || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
