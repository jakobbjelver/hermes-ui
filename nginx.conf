server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS resolver to re-resolve the hermes hostname
    # on every request — prevents stale IP caching after container restarts.
    # Without this, nginx resolves "hermes" once at startup and never
    # re-resolves, so a restarted hermes container with a new IP causes
    # "502: Connection refused" until hermes-ui itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # hermes-ui static files (React SPA)
    root /usr/share/nginx/html;
    index index.html;

    # API → proxy to hermes gateway (matching /api, /api/, /api/anything)
    # WebSocket upgrade path is /api/ws
    location /api {
        set $upstream hermes:9119;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check → proxy to hermes gateway
    location /health {
        set $upstream hermes:9119;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
    }

    # Auth → proxy to hermes gateway
    location /auth {
        set $upstream hermes:9119;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login → proxy to hermes gateway
    location /login {
        set $upstream hermes:9119;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
